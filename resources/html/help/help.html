<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星瀚插件帮助</title>
    <link rel="stylesheet" href="./help.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>星瀚插件</h1>
            </div>
            <div class="version">v1.0.0</div>
        </header>

        <!-- 简介 -->
        <section class="intro">
            <p>TRSS-Yunzai 动态表情包生成插件</p>
        </section>

        <!-- 表情包列表 -->
        <section class="section">
            <h2 class="section-title">
                <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                表情包指令
            </h2>
            <div class="card-grid">
                {{stickers}}
            </div>
        </section>

        <!-- 管理指令 -->
        <section class="section">
            <h2 class="section-title">
                <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                管理指令
            </h2>
            <div class="admin-grid">
                <div class="admin-card">
                    <div class="admin-title">#星瀚帮助</div>
                    <div class="admin-desc">显示此帮助信息</div>
                    <div class="admin-badge">所有人</div>
                </div>
                <div class="admin-card">
                    <div class="admin-title">#星瀚更新</div>
                    <div class="admin-desc">更新并自动重启</div>
                    <div class="admin-badge admin">仅管理员</div>
                </div>
                <div class="admin-card">
                    <div class="admin-title">#星瀚强制更新</div>
                    <div class="admin-desc">强制更新（放弃本地修改）</div>
                    <div class="admin-badge admin">仅管理员</div>
                </div>
            </div>
        </section>

        <!-- 使用说明 -->
        <section class="section">
            <h2 class="section-title">
                <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                使用说明
            </h2>
            <div class="usage-grid">
                <div class="usage-card">
                    <div class="usage-label">使用自己头像</div>
                    <div class="usage-cmd">#摸头</div>
                </div>
                <div class="usage-card">
                    <div class="usage-label">使用他人头像</div>
                    <div class="usage-cmd">#摸头 @某人</div>
                </div>
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-text">星瀚插件 · 让表情包更有趣</div>
            <div class="footer-links">
                <a href="https://gitee.com/xialuo03/xinghan-plugin" class="footer-link">Gitee</a>
                <span class="footer-divider">·</span>
                <a href="https://github.com/xialuo0511/xinghan-plugin" class="footer-link">GitHub</a>
            </div>
        </footer>
    </div>
</body>
</html>
